permissions:
  contents: read
  id-token: write
  pull-requests: write  # Add this for PR comments

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Update to v4 (v7 is deprecated)

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          export_environment_variables: true
          workload_identity_provider: projects/693101320934/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-github-actions@terraform-lab-504603.iam.gserviceaccount.com

      - name: Check Google credentials
        shell: bash
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}"
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "Google credential configuration exists."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -diff -recursive

      - name: Terraform Init
        working-directory: environments/dev
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: terraform init

      - name: Terraform Validate
        working-directory: environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/dev
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply (main branch only)  # Add this step
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: environments/dev
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: terraform apply -auto-approve tfplan

      - name: Comment PR with Plan (PR only)  # Add this step
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ github.workspace }}/tfplan', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${planOutput}\n\`\`\``
            });