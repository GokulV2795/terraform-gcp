permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/693101320934/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-github-actions@terraform-lab-504603.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform Version
        run: terraform version

      - name: Terraform Format Check
        run: terraform fmt -check -diff -recursive

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init

      - name: Terraform Validate
        working-directory: environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/dev
        run: terraform plan