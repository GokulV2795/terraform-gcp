steps:
  - id: terraform-init
    name: hashicorp/terraform:1.15.8
    entrypoint: sh
    args:
      - -c
      - |
        cd environments/dev
        terraform init

  - id: terraform-validate
    name: hashicorp/terraform:1.15.8
    entrypoint: sh
    args:
      - -c
      - |
        cd environments/dev
        terraform validate

  - id: terraform-plan
    name: hashicorp/terraform:1.15.8
    entrypoint: sh
    args:
      - -c
      - |
        cd environments/dev
        terraform plan

  - id: terraform-apply
    name: hashicorp/terraform:1.15.8
    entrypoint: sh
    args:
      - -c
      - |
        cd environments/dev
        terraform apply -auto-approve

options:
  logging: CLOUD_LOGGING_ONLY